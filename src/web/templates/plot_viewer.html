<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wood FPM Plot Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
  <style>
    :root {
      --bg: #16171b;
      --panel: #21242b;
      --fg: #e9edf4;
      --muted: #9097a7;
      --accent: #5ec6ff;
      --border: #313641;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #232837, var(--bg) 55%);
      color: var(--fg);
      font: 14px/1.4 system-ui, sans-serif;
    }

    main {
      min-height: 100vh;
      padding: 18px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 36px);
      background: rgba(33, 36, 43, 0.94);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    #status {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    #plot {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      height: calc(100vh - 108px);
    }

    @media (max-width: 720px) {
      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      #status {
        text-align: left;
      }

      #plot {
        height: calc(100vh - 136px);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div class="header">
        <h1>Wood FPM Plot Viewer</h1>
        <div id="status">Waiting for scan history...</div>
      </div>
      <div id="plot"></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='plot_viewer.js') }}"></script>
</body>
</html>
