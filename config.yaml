# Wood FPM firmware configuration.
# Values marked TBD must be measured/confirmed before running on hardware.

machine:
  # Workspace bounds, in mm, in the user-facing XY plane.
  bounds:
    x_min: -30.0
    x_max:  30.0
    y_min: -30.0
    y_max:  30.0
  v_max_mm_s:   20.0   # TBD: max workspace feedrate
  a_max_mm_s2: 100.0   # TBD: max workspace acceleration
  jog_step_mm:  1.0    # default UI jog increment
  scan_feed_mm_s: 2.0  # slow feed during probing descent
  rapid_feed_mm_s: 15.0
  # Per-axis motor current ceiling. Any move that observes |current| above
  # this on either axis halts both motors and raises OvercurrentError.
  # Homing uses its own threshold (axes.*.home_current_threshold_mA); this
  # limit is a safety net above it. Set to 0 to disable.
  overcurrent_limit_mA: 6000

kinematics:
  # PPM parameters (Triangular-Bipyramid Lc/H/D/G form). TBD — measure on hardware.
  Lc: 100.0
  H:  20.0
  D:  15.0
  G:  60.0          # degrees
  theta_max_deg: 25 # joint-angle envelope; soft limit before motor commands

axes:
  # Each EPOS2 has its own USB cable to the Pi. Maxon enumerates them as
  # USB0, USB1, ... (not /dev/ttyUSB*). If the two motors come up swapped,
  # flip USB0/USB1 here. epos_node is the controller's internal CAN id
  # (factory default 1); change only if reconfigured via EPOS Studio.
  #
  # counts_per_rev = encoder counts per MOTOR-shaft revolution as reported
  # by the EPOS. The ENC 16 EASY XT is 1024 cpt; the EPOS does 4x
  # quadrature decoding (counts every edge on A and B), giving 1024 × 4 =
  # 4096 counts per motor rev. gear_ratio is then the purely mechanical
  # reduction. Total counts per output rev = counts_per_rev × gear_ratio
  # = 4096 × 4.3 ≈ 17613.
  theta:            # motor 0 — drives PPM theta joint
    epos_node: 1
    port_name: USB1
    counts_per_rev: 4096   # 1024 cpt × 4x quadrature
    gear_ratio: 4.3        # planetary reduction (motor -> joint)
    invert: false
    home_method: -3        # EPOS2 homing: current threshold, positive speed (hard stop)
    home_speed_rpm: 50
    home_accel_rpm_s: 500
    home_current_threshold_mA: 3000
  phi:              # motor 1 — drives PPM phi joint
    epos_node: 1
    port_name: USB0
    counts_per_rev: 4096
    gear_ratio: 4.3
    invert: false
    home_method: -3
    home_speed_rpm: 50
    home_accel_rpm_s: 500
    home_current_threshold_mA: 3000

probe:
  gpio_pin: 17       # BCM numbering
  active_low: true   # NPN-NO: input pulled high, goes low on contact
  debounce_us: 200

network:
  host: "0.0.0.0"    # 0.0.0.0 = LAN-accessible; 127.0.0.1 = local only
  port: 5000

driver:
  # Set to true to run without hardware (kinematics + simulated motors + simulated probe).
  # Useful for UI development on a non-Pi machine.
  simulate: false
  epos_library: libEposCmd.so
