# Wood FPM firmware configuration.
#
# Marlin handles the FPM kinematics on its side, so the Pi just sends and
# receives workspace XY coordinates over serial. This config covers only
# the Pi-side concerns: workspace envelope, feedrates, Marlin link, and
# web server binding.

machine:
  # Workspace bounds, in mm, in the user-facing XY plane.
  # The Pi rejects any move outside this rectangle before issuing a G-code.
  # Set Marlin's MIN_POS / MAX_POS to match (or wider) so Marlin and the
  # firmware agree on what's reachable.
  bounds:
    x_min: -150.0
    x_max:  150.0
    y_min: -150.0
    y_max:  150.0
  v_max_mm_s:   50.0   # TBD: max workspace feedrate
  a_max_mm_s2: 100.0   # TBD: max workspace acceleration
  jog_step_mm:  1.0    # default UI jog increment
  scan_feed_mm_s: 20.0  # slow feed during probing descent
  rapid_feed_mm_s: 50.0

marlin:
  # The web UI chooses the serial port and baudrate at connect time.
  # Leave only axis mapping here unless you want CLI-side defaults.
  # Marlin axis letters that map to workspace X / Y / Z. Defaults match a
  # standard Marlin configuration. Change here only if your Marlin firmware
  # reports the workspace axes under different letters.
  x_axis: X
  y_axis: Y
  z_axis: Z

network:
  host: "0.0.0.0"    # 0.0.0.0 = LAN-accessible; 127.0.0.1 = local only
  port: 5000
  plot_port: 5001     # separate read-only plot page with live CSV refresh

driver:
  # Set to true to run without hardware (simulated Marlin board + simulated
  # probing responses). Useful for UI development on a non-Pi machine. With
  # false, the web app starts disconnected and the Serial panel is used to
  # connect.
  simulate: false
